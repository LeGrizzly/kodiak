name: Test & Coverage

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test-coverage:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest
    
    services:
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.36.0
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Run Tests with Coverage
        run: bun run coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always() # Upload report even if tests fail (to see what failed)
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
